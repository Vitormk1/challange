<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Smart Charge — mapa de carregadores</title>
<meta name="description" content="Mapa dos pontos de recarga Smart Charge. Aberto, sem cadastro e sem login.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0D0F">
<link rel="icon" type="image/png" sizes="32x32" href="./img/logo-32.png?v=20260916s">
<link rel="icon" type="image/png" sizes="256x256" href="./img/logo.png?v=20260916s">
<link rel="apple-touch-icon" href="./img/logo-180.png?v=20260916s">
<link rel="stylesheet" href="./static/leaflet/leaflet.css?v=20260916s">
<link rel="stylesheet" href="./site.css?v=20260916s">
<link rel="stylesheet" href="./mapa.css?v=20260916s">
<link rel="stylesheet" href="./cliente.css?v=20260916s">
<link rel="stylesheet" href="./carregando.css?v=20260916s">
<script src="./carregando.js?v=20260916s"></script>
<noscript><style>#carregando{display:none}</style></noscript>
</head>
<body class="pagina-mapa">
<!-- Cortina de carregamento. Cobre a tela desde a primeira pintura e sai
     quando a pagina esta pronta; ver docs/carregando.js. -->
<div id="carregando" role="status" aria-live="polite">
  <div class="carregando-miolo">
    <span class="carregando-giro" aria-hidden="true"></span>
    <p class="carregando-marca">Smart Charge</p>
    <p class="carregando-nota">Carregando…</p>
  </div>
</div>


<a class="pular" href="#lista">Pular para a lista de carregadores</a>

<div class="mapa-palco">
  <div id="mapa" role="application" aria-label="Mapa dos pontos de recarga Smart Charge"></div>

  <!-- Barra de busca. No computador ela é o topo da página; no celular
       flutua sobre o mapa, arredondada, como a do Google Maps. -->
  <header class="mapa-topo">
    <a class="mapa-voltar" href="./" aria-label="Voltar à apresentação">
      <img src="./img/logo.png" alt="" width="26" height="26">
      <span>Smart Charge</span>
    </a>

    <label class="mapa-busca">
      <span class="sr-only">Buscar por nome, bairro ou segmento</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input type="search" id="buscaPontos" placeholder="Buscar ponto de recarga" autocomplete="off">
      <button class="mapa-busca-limpar" id="limparBusca" type="button" hidden aria-label="Limpar busca">×</button>
    </label>

    <a class="mapa-painel" href="./dashboard.html"><span>Painel</span></a>
  </header>

  <!-- Botão flutuante, na altura do polegar -->
  <button class="mapa-fab" id="botaoLocal" type="button" aria-label="Centralizar na minha localização">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3"></path>
      <circle cx="12" cy="12" r="7.5"></circle>
    </svg>
  </button>

  <!-- A pílula chama a folha de volta quando ela está fechada. -->
  <button class="mapa-pilula" id="botaoLista" type="button"
          aria-expanded="false" aria-controls="painelLista">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path>
    </svg>
    <span id="rotuloPilula">Lista</span>
  </button>

  <!-- Folha de baixo no celular; coluna da esquerda no computador. -->
  <aside class="mapa-lista" id="painelLista" aria-labelledby="tituloLista">
    <div class="mapa-alca" id="alcaLista" role="separator" aria-label="Arraste para abrir ou fechar"></div>

    <div class="mapa-lista-topo">
      <div>
        <h1 id="tituloLista">Pontos de recarga</h1>
        <p id="contagemPontos">Carregando…</p>
      </div>
      <button class="mapa-lista-fechar" id="fecharLista" type="button" aria-label="Fechar a lista">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>

    <ul class="mapa-pontos" id="lista"></ul>
  </aside>

  <!-- ===================== reserva =====================
       Fica fora da .mapa-lista de propósito: a folha da lista arrasta e tem
       três alturas, e um formulário dentro dela brigaria com o gesto — puxar
       para escolher a hora fecharia a folha. -->
  <div class="reserva" id="folhaReserva" hidden>
    <div class="reserva-fundo"></div>
    <div class="reserva-caixa" role="dialog" aria-modal="true" aria-labelledby="reservaTitulo">
      <div class="reserva-topo">
        <div>
          <p class="reserva-olho">Reservar vaga</p>
          <h2 id="reservaTitulo"><span id="reservaLoja"></span></h2>
        </div>
        <button class="reserva-fechar" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <fieldset class="reserva-campo">
        <legend>Vaga</legend>
        <div id="reservaVagas"></div>
      </fieldset>

      <div class="reserva-quando">
        <label class="reserva-campo">
          <span>Dia</span>
          <input type="date" id="reservaDia">
        </label>
        <label class="reserva-campo">
          <span>Hora</span>
          <select id="reservaHora"></select>
        </label>
      </div>

      <p class="reserva-resumo" id="reservaResumo"></p>
      <button class="reserva-enviar" id="reservaEnviar" type="button" disabled>Confirmar reserva</button>
      <p class="reserva-status" id="reservaStatus" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Ancorado no mapa, e não num rodapé: quem olha o mapa nunca chega a um. -->
  <p class="mapa-aviso" role="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><path d="M12 7.6h.01"></path>
    </svg>
    <span>Pontos simulados — localizações fictícias.</span>
  </p>
</div>


<!-- ===================== barra de abas =====================
     Chega escondida e só aparece se o cliente.js confirmar um motorista
     logado. O mapa é página aberta: oferecer as três abas a quem não tem
     conta seria prometer telas que ele não consegue abrir. -->
<nav class="barra-app" aria-label="Seções da sua conta" hidden>
  <a class="barra-app-item" href="./cliente.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.2" y="3.2" width="7.4" height="8.6" rx="1.8"></rect>
      <rect x="13.4" y="3.2" width="7.4" height="5.4" rx="1.8"></rect>
      <rect x="13.4" y="12.2" width="7.4" height="8.6" rx="1.8"></rect>
      <rect x="3.2" y="15.4" width="7.4" height="5.4" rx="1.8"></rect>
    </svg>
    <span>Dashboard</span>
  </a>
  <a class="barra-app-item" href="./mapa.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 10c0 5.5-8 12-8 12s-8-6.5-8-12a8 8 0 1 1 16 0Z"></path>
      <circle cx="12" cy="10" r="2.8"></circle>
    </svg>
    <span>Mapa</span>
  </a>
  <a class="barra-app-item" href="./carteira.html">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.5 7.4A2.4 2.4 0 0 1 5.9 5h11.7a2 2 0 0 1 2 2v1.4"></path>
      <path d="M3.5 7.4v9.2A2.4 2.4 0 0 0 5.9 19h12.7a1.9 1.9 0 0 0 1.9-1.9v-2.2"></path>
      <path d="M20.5 10.6h-4a2 2 0 0 0 0 4h4a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5Z"></path>
    </svg>
    <span>Carteira</span>
  </a>
</nav>

<script src="./config.js"></script>
<script src="./static/leaflet/leaflet.js?v=20260916s"></script>
<script src="./mapa.js?v=20260916s"></script>
<script type="module" src="./cliente.js?v=20260916s"></script>
</body>
</html>
