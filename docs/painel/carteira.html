        <p>A ideia é reunir num lugar só o pagamento da recarga e o cashback
        de cada loja, para você não precisar do cartão no caixa.</p>
        <a class="botao-cliente" href="./cliente.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6"></path>
          </svg>
