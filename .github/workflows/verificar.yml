# Verificação automática dos Pull Requests.
#
# Três checagens, escolhidas por serem baratas e por pegarem o que de fato
# costuma passar batido quando entra gente nova num repositório:
#
#   sintaxe   — um `.py` ou `.js` que não compila derruba o deploy inteiro,
#               porque o Render publica o main sem perguntar nada
#   segredo   — a mais importante. Chave que entra no histórico do Git
#               continua lá depois de removida, e este repositório é público
#
# A carteira tem testes transacionais com Asaas simulada, sem credenciais.
# A auditoria real continua fora do CI porque precisa de um banco configurado.

name: Verificar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sintaxe:
    name: Sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python compila
        run: |
          python -m compileall -q api/ && echo "ok: todo .py compila"

      - name: Testes do backend e carteira sem banco ou pagamentos reais
        run: |
          pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript compila
        run: |
          # `node --check` só lê, não executa. O static/ fica de fora porque
          # é biblioteca de terceiro (Leaflet, Motion) e não é nosso para
          # corrigir.
          erros=0
          for f in $(find docs -name "*.js" -not -path "*/static/*"); do
            if node --check "$f"; then
              echo "  ok   $f"
            else
              echo "  FALHA $f"
              erros=1
            fi
          done
          exit $erros

      - name: CSS com chaves equilibradas
        run: |
          python - <<'FIM'
          import pathlib, sys
          ruim = False
          for p in pathlib.Path("docs").rglob("*.css"):
              if "static" in p.parts:
                  continue
              t = p.read_text(encoding="utf-8")
              a, f = t.count("{"), t.count("}")
              if a != f:
                  print(f"  FALHA {p}: {a} abrem, {f} fecham")
                  ruim = True
              else:
                  print(f"  ok   {p}")
          sys.exit(1 if ruim else 0)
          FIM

  segredo:
    name: Nenhum segredo no diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # precisa do histórico para comparar com o main
          fetch-depth: 0

      - name: Procurar chave vazada
        run: |
          # Os padrões são os das chaves que este projeto usa de verdade.
          # `|| true` no grep porque ele sai 1 quando não acha — e não achar
          # é justamente o resultado bom.
          alvo="${{ github.event_name == 'pull_request' && 'origin/main...HEAD' || 'HEAD~1...HEAD' }}"
          # O segundo grep tira localhost: docker-compose.dev.yml traz
          # `smart:smart@localhost` de propósito, que é credencial descartável
          # de banco local e não segredo. Sem esse filtro, o próprio arquivo
          # que documenta o banco de desenvolvimento reprovaria o PR.
          achado=$(git diff $alvo \
            | grep -nE 'sk-or-v1-[A-Za-z0-9]{16}|AVNS_[A-Za-z0-9_-]{12}|postgres(ql)?://[^ ]+:[^ @]+@' \
            | grep -v 'localhost\|127\.0\.0\.1' || true)

          if [ -n "$achado" ]; then
            echo "::error::Há segredo no diff deste PR."
            echo "$achado" | head -20
            echo ""
            echo "Chave que entra no histórico do Git CONTINUA LÁ depois de removida,"
            echo "e este repositório é público. Não conserte com outro commit por cima:"
            echo "fale com o Vitor, porque a chave precisa ser trocada no serviço."
            exit 1
          fi
          echo "ok: nenhum segredo encontrado"

      - name: Nenhuma variável usada sem existir
        run: |
          # Uma regra só, `no-undef`, e ela existe por um caso concreto: um
          # commit usou `emEdicao`, que nunca foi declarada, e o painel inteiro
          # parou de abrir para quem tinha aquele card salvo. A tela ficava no
          # carregamento para sempre, sem mensagem.
          #
          # O `node --check` acima NÃO pega isso: a sintaxe estava correta. Só
          # aparece ao executar — e executar era justamente o que ninguém fez
          # antes de mesclar.
          #
          # Sem package.json de propósito: o projeto não usa npm, e o --yes
          # baixa o eslint só para esta checagem. A configuração está em
          # eslint.config.mjs, e dá para rodar igual na sua máquina:
          #
          #     npx eslint docs/painel
          npx --yes eslint@9 docs/painel

      - name: Acentos não podem estar corrompidos
        run: |
          # Um editor gravando em Latin-1 no lugar de UTF-8 transforma "ação"
          # em "aÃ§Ã£o" e reescreve o arquivo inteiro. Já aconteceu: um commit
          # de uma linha corrompeu 732 trechos do app.js, e o estrago só
          # apareceu porque alguém estranhou um diff de 443 linhas.
          #
          # Parte do dano é irreversível — caracteres fora do Latin-1, como o
          # marcador ● e as aspas tipográficas, somem em vez de se
          # transformar. Por isso a barreira é aqui, antes de entrar.
          #
          # Se falhar: no VS Code, "Reopen with Encoding > UTF-8", depois
          # "Save with Encoding > UTF-8". E ajuste files.encoding para utf8.
          python - <<'FIM'
          import pathlib, sys
          MARCAS = ["Ã©","Ã£","Ã¡","Ãª","Ã§","Ãµ","Ã­","Ã³","Ãº","â€”","â€œ","Â "]
          ruim = False
          for p in list(pathlib.Path("docs").rglob("*")) + list(pathlib.Path("api").rglob("*")):
              if p.suffix not in (".js", ".css", ".html", ".py", ".sql", ".md"): continue
              if "static" in p.parts: continue          # biblioteca de terceiro
              try: t = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError): continue
              n = sum(t.count(m) for m in MARCAS)
              if t.startswith("﻿"):
                  print(f"::error file={p}::arquivo começa com BOM"); ruim = True
              if n:
                  print(f"::error file={p}::{n} trecho(s) com acento corrompido (gravado em Latin-1?)")
                  ruim = True
          if ruim:
              print("")
              print("Abra o arquivo no VS Code: Reopen with Encoding > UTF-8,")
              print("depois Save with Encoding > UTF-8. E ajuste files.encoding.")
              sys.exit(1)
          print("ok: acentuação íntegra")
          FIM

      - name: O .env não pode estar versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env foi commitado. Ele tem senha de banco e chave de API."
            exit 1
          fi
          echo "ok: .env continua fora do repositório"
