# Infraestrutura como arquivo, não como cliques.
#
# O Render lê isto e monta o serviço sozinho. A vantagem de estar no
# repositório é que o próximo que for subir uma cópia não precisa adivinhar
# nem lembrar o que foi configurado na tela.
#
# Como usar: Render → New → Blueprint → aponta para este repositório.
# As chaves marcadas `sync: false` NÃO ficam aqui — o Render pergunta e
# guarda no cofre dele. Segredo em arquivo versionado é segredo vazado.

services:
  - type: web
    name: praca-recarga-api
    runtime: python
    plan: free
    region: oregon          # mais perto do Aiven; ver comentário abaixo
    # Sem `rootDir`. Com ele apontando para api/, o Render pula o build quando
    # nada dentro daquela pasta muda — e desde que o painel passou a ser
    # servido por este processo, mudança de tela vive em docs/. Um commit que
    # só mexia no painel era ignorado em silêncio: o GitHub tinha a versão
    # nova, o serviço continuava com a antiga, e nada acusava.
    # Só o pip. Aplicar o schema.sql aqui foi tentado e REPROVOU: os deploys
    # bd03854 (Blueprint) e 358064b falharam em 20s e 16s, e a esteira ficou
    # travada até este commit. O build do Render não é lugar de falar com o
    # banco — ver a investigação no próximo commit.
    #
    # O problema que aquilo tentava resolver continua de pé e está anotado
    # para não se perder: o schema.sql só é aplicado quando alguém roda
    # `python api/db.py` à mão. Mudança de esquema NÃO chega sozinha à
    # produção, e o sintoma de esquecer é ruim de diagnosticar — deploy
    # verde, serviço no ar, e um erro genérico quando alguém abre a tela
    # nova. Foi assim com o papel 'motorista', que devolvia 409 em e-mail
    # novo.
    #
    # Enquanto não houver solução: depois de mexer em api/schema.sql, rode
    #     python api/db.py
    # apontando para o banco de produção, ANTES de mesclar.
    buildCommand: pip install -r requirements.txt
    # `--app-dir api` põe api/ no sys.path, que é o que faz `from db import`
    # funcionar. O caminho do painel é calculado a partir de __file__, então
    # não depende de onde o processo foi iniciado.
    #
    # 1 worker de propósito: o plano gratuito tem 512 MB, e cada worker abre
    # seu próprio pool de conexões contra o Postgres.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --app-dir api
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ---- segredos: preenchidos no painel do Render, nunca aqui ----
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_MODEL
        value: mistralai/mistral-small-24b-instruct-2501

      # Mesma origem não precisa de CORS: o painel é servido por este mesmo
      # processo, agora em smartcharge.ia.br. Isto fica só para o
      # desenvolvimento local apontar para cá quando for preciso depurar, e
      # para a cópia antiga no GitHub Pages, que só redireciona.
      - key: ORIGENS_PERMITIDAS
        value: https://vitormk1.github.io

      # Em HTTPS o cookie de sessão exige HTTPS.
      - key: COOKIE_SEGURO
        value: "1"

      # O painel é servido por este mesmo processo, então o cookie é de
      # primeira parte e Lax basta. Com o painel em outro domínio (a versão
      # anterior, no GitHub Pages) era preciso SameSite=None, e aí Safari,
      # Firefox, Brave e o anônimo do Chrome descartavam o cookie por ser de
      # terceiro — login respondia 200 e a sessão nunca colava.
      - key: COOKIE_SAMESITE
        value: lax
